<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
  <title id="title">Rea color system</title>
  <desc id="desc">Professional color system board for Rea, including brand aqua, mist neutrals, semantic roles, cycle phases, and dark theme colors.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#062633" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #F3FAFC; }
      .panel { fill: #FFFFFF; stroke: #CFE6EE; stroke-width: 1; filter: url(#softShadow); }
      .panel-flat { fill: #FFFFFF; stroke: #CFE6EE; stroke-width: 1; }
      .title { font: 700 54px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102631; letter-spacing: -1px; }
      .hero-title { font: 700 54px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #062633; letter-spacing: -1px; }
      .hero-subtitle { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #062633; opacity: 0.86; }
      .subtitle { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #416878; }
      .section { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102631; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102631; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #416878; }
      .tiny { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #416878; letter-spacing: 0.4px; }
      .white { fill: #FFFFFF; }
      .ink { fill: #062633; }
      .muted { fill: #4F7482; }
      .rule { stroke: #CFE6EE; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1420"/>

  <rect x="70" y="60" width="1460" height="190" rx="38" fill="#7CD9F9"/>
  <path d="M1320 101 C1306 101 1294 109 1287 121 L1247 190 C1236 209 1249 232 1271 232 H1369 C1391 232 1404 209 1393 190 L1353 121 C1346 109 1334 101 1320 101Z" fill="#062633" opacity="0.14"/>
  <text x="110" y="138" class="hero-title">Rea Color System</text>
  <text x="110" y="180" class="hero-subtitle">Celeste vivo como firma y accion primaria, tinta profunda como contraste.</text>
  <rect x="110" y="205" width="210" height="34" rx="17" fill="#062633"/>
  <text x="132" y="227" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#7CD9F9">Signature #7CD9F9</text>
  <rect x="338" y="205" width="205" height="34" rx="17" fill="#FFFFFF" opacity="0.48"/>
  <text x="360" y="227" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#062633">On brand #062633</text>

  <rect class="panel" x="70" y="290" width="1460" height="250" rx="30"/>
  <text x="105" y="337" class="section">Brand aqua scale</text>
  <text x="105" y="365" class="small">Aqua 300 is the exact Rea signature and light primary action. Use Aqua 700 for text links.</text>
  <g transform="translate(105 394)">
    <rect width="112" height="64" rx="16" fill="#F0FCFF"/><text x="14" y="90" class="tiny">50</text><text x="14" y="110" class="small">#F0FCFF</text>
    <g transform="translate(122 0)"><rect width="112" height="64" rx="16" fill="#DDF7FE"/><text x="14" y="90" class="tiny">100</text><text x="14" y="110" class="small">#DDF7FE</text></g>
    <g transform="translate(244 0)"><rect width="112" height="64" rx="16" fill="#B9EEFC"/><text x="14" y="90" class="tiny">200</text><text x="14" y="110" class="small">#B9EEFC</text></g>
    <g transform="translate(366 0)"><rect width="112" height="64" rx="16" fill="#7CD9F9"/><text x="14" y="90" class="tiny">300 SIGNATURE</text><text x="14" y="110" class="small">#7CD9F9</text></g>
    <g transform="translate(488 0)"><rect width="112" height="64" rx="16" fill="#45C8F1"/><text x="14" y="90" class="tiny">400</text><text x="14" y="110" class="small">#45C8F1</text></g>
    <g transform="translate(610 0)"><rect width="112" height="64" rx="16" fill="#18AEDD"/><text x="14" y="90" class="tiny">500</text><text x="14" y="110" class="small">#18AEDD</text></g>
    <g transform="translate(732 0)"><rect width="112" height="64" rx="16" fill="#087FA6"/><text x="14" y="90" class="tiny">600 ACTIVE</text><text x="14" y="110" class="small">#087FA6</text></g>
    <g transform="translate(854 0)"><rect width="112" height="64" rx="16" fill="#076583"/><text x="14" y="90" class="tiny">700 LINK</text><text x="14" y="110" class="small">#076583</text></g>
    <g transform="translate(976 0)"><rect width="112" height="64" rx="16" fill="#0A4F68"/><text x="14" y="90" class="tiny">800</text><text x="14" y="110" class="small">#0A4F68</text></g>
    <g transform="translate(1098 0)"><rect width="112" height="64" rx="16" fill="#083C50"/><text x="14" y="90" class="tiny">900</text><text x="14" y="110" class="small">#083C50</text></g>
    <g transform="translate(1220 0)"><rect width="112" height="64" rx="16" fill="#062633"/><text x="14" y="90" class="tiny">950 INK</text><text x="14" y="110" class="small">#062633</text></g>
  </g>

  <rect class="panel" x="70" y="580" width="710" height="400" rx="30"/>
  <text x="105" y="627" class="section">Foundation roles</text>
  <text x="105" y="655" class="small">Aqua is the brand. Mist is the app atmosphere. Ink carries readability.</text>
  <g transform="translate(105 685)">
    <rect width="132" height="76" rx="18" fill="#F3FAFC" stroke="#CFE6EE"/><text x="14" y="104" class="tiny">BACKGROUND</text><text x="14" y="124" class="small">#F3FAFC</text>
    <g transform="translate(152 0)"><rect width="132" height="76" rx="18" fill="#FFFFFF" stroke="#CFE6EE"/><text x="14" y="104" class="tiny">SURFACE</text><text x="14" y="124" class="small">#FFFFFF</text></g>
    <g transform="translate(304 0)"><rect width="132" height="76" rx="18" fill="#E8F5F9" stroke="#CFE6EE"/><text x="14" y="104" class="tiny">SURFACE ALT</text><text x="14" y="124" class="small">#E8F5F9</text></g>
    <g transform="translate(456 0)"><rect width="132" height="76" rx="18" fill="#CFE6EE"/><text x="14" y="104" class="tiny">BORDER</text><text x="14" y="124" class="small">#CFE6EE</text></g>
    <g transform="translate(0 146)"><rect width="132" height="76" rx="18" fill="#102631"/><text x="14" y="104" class="tiny">TEXT</text><text x="14" y="124" class="small">#102631</text></g>
    <g transform="translate(152 146)"><rect width="132" height="76" rx="18" fill="#416878"/><text x="14" y="104" class="tiny">SECONDARY</text><text x="14" y="124" class="small">#416878</text></g>
    <g transform="translate(304 146)"><rect width="132" height="76" rx="18" fill="#4F7482"/><text x="14" y="104" class="tiny">MUTED</text><text x="14" y="124" class="small">#4F7482</text></g>
    <g transform="translate(456 146)"><rect width="132" height="76" rx="18" fill="#062633"/><text x="14" y="104" class="tiny">ON BRAND</text><text x="14" y="124" class="small">#062633</text></g>
  </g>

  <rect class="panel" x="820" y="580" width="710" height="400" rx="30"/>
  <text x="855" y="627" class="section">Semantic roles</text>
  <text x="855" y="655" class="small">Primary action keeps Rea aqua. Dark ink and edge/shadow handle contrast.</text>
  <g transform="translate(855 685)">
    <rect width="190" height="86" rx="24" fill="#7CD9F9" stroke="#076583"/><text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#062633">Primary action</text><text x="24" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#062633">#7CD9F9 + #062633</text>
    <g transform="translate(215 0)"><rect width="132" height="86" rx="20" fill="#E8FBF1"/><circle cx="28" cy="28" r="10" fill="#37C989"/><text x="48" y="34" class="label">Success</text><text x="20" y="64" class="small">#37C989</text></g>
    <g transform="translate(367 0)"><rect width="132" height="86" rx="20" fill="#FFF7D7"/><circle cx="28" cy="28" r="10" fill="#F8B633"/><text x="48" y="34" class="label">Warning</text><text x="20" y="64" class="small">#F8B633</text></g>
    <g transform="translate(519 0)"><rect width="132" height="86" rx="20" fill="#FFF0F5"/><circle cx="28" cy="28" r="10" fill="#EF3F78"/><text x="48" y="34" class="label">Danger</text><text x="20" y="64" class="small">#EF3F78</text></g>
    <g transform="translate(0 128)"><rect width="314" height="86" rx="22" fill="#DDF7FE"/><text x="24" y="33" class="label">Selection tint</text><text x="24" y="56" class="small">#DDF7FE for selected chips</text><text x="24" y="74" class="small">rows, and soft emphasis</text></g>
    <g transform="translate(338 128)"><rect width="313" height="86" rx="22" fill="#F0FCFF" stroke="#7CD9F9"/><text x="24" y="33" class="label">Brand subtle</text><text x="24" y="56" class="small">#F0FCFF for quiet</text><text x="24" y="74" class="small">brand surfaces</text></g>
  </g>

  <rect class="panel" x="70" y="1020" width="1460" height="245" rx="30"/>
  <text x="105" y="1067" class="section">Cycle phases</text>
  <text x="105" y="1095" class="small">Each phase has surface, accent, and solid CTA color. Hero controls inherit phase, not global primary.</text>
  <g transform="translate(105 1125)">
    <rect width="180" height="104" rx="24" fill="#EAF8FD"/><circle cx="35" cy="35" r="14" fill="#26BCEB"/><text x="58" y="41" class="label" fill="#075E7B">Unknown</text><text x="24" y="75" class="small" fill="#075E7B">#EAF8FD / #26BCEB</text>
    <g transform="translate(198 0)"><rect width="180" height="104" rx="24" fill="#FFF0F5"/><circle cx="35" cy="35" r="14" fill="#EF3F78"/><text x="58" y="41" class="label" fill="#8E1E43">Menstrual</text><text x="24" y="75" class="small" fill="#8E1E43">#FFF0F5 / #EF3F78</text></g>
    <g transform="translate(396 0)"><rect width="180" height="104" rx="24" fill="#E8FBF1"/><circle cx="35" cy="35" r="14" fill="#37C989"/><text x="58" y="41" class="label" fill="#0E6848">Follicular</text><text x="24" y="75" class="small" fill="#0E6848">#E8FBF1 / #37C989</text></g>
    <g transform="translate(594 0)"><rect width="180" height="104" rx="24" fill="#FFF7D7"/><circle cx="35" cy="35" r="14" fill="#F8B633"/><text x="58" y="41" class="label" fill="#7A4B00">Fertile</text><text x="24" y="75" class="small" fill="#7A4B00">#FFF7D7 / #F8B633</text></g>
    <g transform="translate(792 0)"><rect width="180" height="104" rx="24" fill="#FFF0EA"/><circle cx="35" cy="35" r="14" fill="#FF765C"/><text x="58" y="41" class="label" fill="#A83224">Ovulation</text><text x="24" y="75" class="small" fill="#A83224">#FFF0EA / #FF765C</text></g>
    <g transform="translate(990 0)"><rect width="180" height="104" rx="24" fill="#F2EEFF"/><circle cx="35" cy="35" r="14" fill="#8F78F2"/><text x="58" y="41" class="label" fill="#4C39A5">Luteal</text><text x="24" y="75" class="small" fill="#4C39A5">#F2EEFF / #8F78F2</text></g>
    <g transform="translate(1188 0)"><rect width="180" height="104" rx="24" fill="#E6FAF7"/><circle cx="35" cy="35" r="14" fill="#43C8BC"/><text x="58" y="41" class="label" fill="#096C65">Pregnancy</text><text x="24" y="75" class="small" fill="#096C65">#E6FAF7 / #43C8BC</text></g>
  </g>

  <rect x="70" y="1304" width="1460" height="1" class="rule"/>
  <text x="70" y="1340" class="small">Rule: never use #7CD9F9 as small text on white. Use it as signature/CTA surface with #062633; use #076583 for links.</text>
</svg>
