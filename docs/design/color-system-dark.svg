<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
  <title id="title">Rea dark color system</title>
  <desc id="desc">Dark mode color system board for Rea, including dark surfaces, aqua brand roles, semantic status colors, and cycle phases.</desc>
  <defs>
    <filter id="darkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill: #071A22; }
      .panel { fill: #0E2833; stroke: #246071; stroke-width: 1; filter: url(#darkShadow); }
      .title { font: 700 54px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #EAF8FC; letter-spacing: -1px; }
      .subtitle { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #A9D3DE; }
      .section { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #EAF8FC; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #EAF8FC; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #A9D3DE; }
      .tiny { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #78A7B6; letter-spacing: 0.4px; }
      .rule { stroke: #246071; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1420"/>

  <rect x="70" y="60" width="1460" height="190" rx="38" fill="#0E2833" stroke="#246071"/>
  <path d="M1320 101 C1306 101 1294 109 1287 121 L1247 190 C1236 209 1249 232 1271 232 H1369 C1391 232 1404 209 1393 190 L1353 121 C1346 109 1334 101 1320 101Z" fill="#45C8F1" opacity="0.16"/>
  <text x="110" y="138" class="title">Rea Dark Color System</text>
  <text x="110" y="180" class="subtitle">Aqua brillante sobre base profunda, sin negro puro ni contraste agresivo.</text>
  <rect x="110" y="205" width="188" height="34" rx="17" fill="#45C8F1"/>
  <text x="132" y="227" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#062633">Primary #45C8F1</text>
  <rect x="315" y="205" width="205" height="34" rx="17" fill="#143744"/>
  <text x="337" y="227" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#7CD9F9">Link #7CD9F9</text>

  <rect class="panel" x="70" y="290" width="1460" height="250" rx="30"/>
  <text x="105" y="337" class="section">Dark foundation scale</text>
  <text x="105" y="365" class="small">Dark mode keeps the aqua DNA: blue-black surfaces, luminous text, and bright brand action.</text>
  <g transform="translate(105 394)">
    <rect width="132" height="64" rx="16" fill="#071A22" stroke="#246071"/><text x="14" y="90" class="tiny">BACKGROUND</text><text x="14" y="110" class="small">#071A22</text>
    <g transform="translate(152 0)"><rect width="132" height="64" rx="16" fill="#0E2833" stroke="#246071"/><text x="14" y="90" class="tiny">SURFACE</text><text x="14" y="110" class="small">#0E2833</text></g>
    <g transform="translate(304 0)"><rect width="132" height="64" rx="16" fill="#143744" stroke="#246071"/><text x="14" y="90" class="tiny">SURFACE ALT</text><text x="14" y="110" class="small">#143744</text></g>
    <g transform="translate(456 0)"><rect width="132" height="64" rx="16" fill="#06151B" stroke="#246071"/><text x="14" y="90" class="tiny">SUNKEN</text><text x="14" y="110" class="small">#06151B</text></g>
    <g transform="translate(608 0)"><rect width="132" height="64" rx="16" fill="#246071"/><text x="14" y="90" class="tiny">BORDER</text><text x="14" y="110" class="small">#246071</text></g>
    <g transform="translate(760 0)"><rect width="132" height="64" rx="16" fill="#347A8D"/><text x="14" y="90" class="tiny">BORDER STRONG</text><text x="14" y="110" class="small">#347A8D</text></g>
    <g transform="translate(912 0)"><rect width="132" height="64" rx="16" fill="#EAF8FC"/><text x="14" y="90" class="tiny">TEXT</text><text x="14" y="110" class="small">#EAF8FC</text></g>
    <g transform="translate(1064 0)"><rect width="132" height="64" rx="16" fill="#A9D3DE"/><text x="14" y="90" class="tiny">SECONDARY</text><text x="14" y="110" class="small">#A9D3DE</text></g>
    <g transform="translate(1216 0)"><rect width="132" height="64" rx="16" fill="#78A7B6"/><text x="14" y="90" class="tiny">MUTED</text><text x="14" y="110" class="small">#78A7B6</text></g>
  </g>

  <rect class="panel" x="70" y="580" width="710" height="400" rx="30"/>
  <text x="105" y="627" class="section">Dark roles</text>
  <text x="105" y="655" class="small">Primary remains vivid, but surfaces carry the night mode character.</text>
  <g transform="translate(105 685)">
    <rect width="150" height="86" rx="22" fill="#45C8F1"/><text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#062633">Primary</text><text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#062633">#45C8F1</text>
    <g transform="translate(172 0)"><rect width="150" height="86" rx="22" fill="#7CD9F9"/><text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#062633">Pressed</text><text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#062633">#7CD9F9</text></g>
    <g transform="translate(344 0)"><rect width="150" height="86" rx="22" fill="#062633" stroke="#45C8F1"/><text x="20" y="35" class="label">On primary</text><text x="20" y="60" class="small">#062633</text></g>
    <g transform="translate(516 0)"><rect width="150" height="86" rx="22" fill="#143744" stroke="#7CD9F9"/><text x="20" y="35" class="label">Link</text><text x="20" y="60" class="small">#7CD9F9</text></g>
    <g transform="translate(0 128)"><rect width="150" height="86" rx="22" fill="#0A2B20"/><circle cx="28" cy="28" r="10" fill="#57DDA5"/><text x="48" y="34" class="label">Success</text><text x="20" y="64" class="small">#57DDA5</text></g>
    <g transform="translate(172 128)"><rect width="150" height="86" rx="22" fill="#342507"/><circle cx="28" cy="28" r="10" fill="#FFD166"/><text x="48" y="34" class="label">Warning</text><text x="20" y="64" class="small">#FFD166</text></g>
    <g transform="translate(344 128)"><rect width="150" height="86" rx="22" fill="#351221"/><circle cx="28" cy="28" r="10" fill="#FF7AA2"/><text x="48" y="34" class="label">Danger</text><text x="20" y="64" class="small">#FF7AA2</text></g>
    <g transform="translate(516 128)"><rect width="150" height="86" rx="22" fill="#143744"/><text x="20" y="35" class="label">Skeleton</text><text x="20" y="60" class="small">#143744</text></g>
  </g>

  <rect class="panel" x="820" y="580" width="710" height="400" rx="30"/>
  <text x="855" y="627" class="section">Dark surfaces in use</text>
  <text x="855" y="655" class="small">Cards, buttons, and chips should feel quiet, not gray or clinical.</text>
  <g transform="translate(855 685)">
    <rect width="300" height="230" rx="28" fill="#143744" stroke="#246071"/>
    <text x="28" y="48" class="label">Today card</text>
    <text x="28" y="78" class="small">Surface alt for elevated context.</text>
    <rect x="28" y="112" width="132" height="42" rx="21" fill="#45C8F1"/>
    <text x="52" y="139" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#062633">Check-in</text>
    <rect x="172" y="112" width="96" height="42" rx="21" fill="rgba(124,217,249,0.13)" stroke="#246071"/>
    <text x="196" y="139" class="small">Later</text>
    <rect x="28" y="176" width="240" height="1" fill="#246071"/>
    <text x="28" y="207" class="small">Aqua stays visible without glare.</text>

    <g transform="translate(340 0)">
      <rect width="300" height="230" rx="28" fill="#06151B" stroke="#246071"/>
      <text x="28" y="48" class="label">Sunken area</text>
      <text x="28" y="78" class="small">Inputs and wells use deeper ink.</text>
      <rect x="28" y="112" width="244" height="52" rx="18" fill="#0E2833" stroke="#347A8D"/>
      <text x="50" y="145" class="small">Placeholder #78A7B6</text>
      <rect x="28" y="184" width="112" height="34" rx="17" fill="rgba(124,217,249,0.22)"/>
      <text x="52" y="206" class="small">Selected</text>
    </g>
  </g>

  <rect class="panel" x="70" y="1020" width="1460" height="245" rx="30"/>
  <text x="105" y="1067" class="section">Cycle phases in dark mode</text>
  <text x="105" y="1095" class="small">Deep surfaces preserve phase meaning; hero CTA uses each phase dark accent, not global primary.</text>
  <g transform="translate(105 1125)">
    <rect width="180" height="104" rx="24" fill="#0A2F3E"/><circle cx="35" cy="35" r="14" fill="#5AD8F8"/><text x="58" y="41" class="label">Unknown</text><text x="24" y="75" class="small">#0A2F3E / #5AD8F8</text>
    <g transform="translate(198 0)"><rect width="180" height="104" rx="24" fill="#351221"/><circle cx="35" cy="35" r="14" fill="#FF7AA2"/><text x="58" y="41" class="label">Menstrual</text><text x="24" y="75" class="small">#351221 / #FF7AA2</text></g>
    <g transform="translate(396 0)"><rect width="180" height="104" rx="24" fill="#0A2B20"/><circle cx="35" cy="35" r="14" fill="#57DDA5"/><text x="58" y="41" class="label">Follicular</text><text x="24" y="75" class="small">#0A2B20 / #57DDA5</text></g>
    <g transform="translate(594 0)"><rect width="180" height="104" rx="24" fill="#342507"/><circle cx="35" cy="35" r="14" fill="#FFD166"/><text x="58" y="41" class="label">Fertile</text><text x="24" y="75" class="small">#342507 / #FFD166</text></g>
    <g transform="translate(792 0)"><rect width="180" height="104" rx="24" fill="#381610"/><circle cx="35" cy="35" r="14" fill="#FF9A83"/><text x="58" y="41" class="label">Ovulation</text><text x="24" y="75" class="small">#381610 / #FF9A83</text></g>
    <g transform="translate(990 0)"><rect width="180" height="104" rx="24" fill="#20183C"/><circle cx="35" cy="35" r="14" fill="#B6A7FF"/><text x="58" y="41" class="label">Luteal</text><text x="24" y="75" class="small">#20183C / #B6A7FF</text></g>
    <g transform="translate(1188 0)"><rect width="180" height="104" rx="24" fill="#092E2B"/><circle cx="35" cy="35" r="14" fill="#69DDD3"/><text x="58" y="41" class="label">Pregnancy</text><text x="24" y="75" class="small">#092E2B / #69DDD3</text></g>
  </g>

  <rect x="70" y="1304" width="1460" height="1" class="rule"/>
  <text x="70" y="1340" class="small">Rule: dark mode is not inverted light mode. It uses aqua-black surfaces, luminous content, and softer borders.</text>
</svg>
