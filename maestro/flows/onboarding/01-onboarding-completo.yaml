# Onboarding completo: welcome → profile → intent → cycle → regularity →
# last-period → contraception → notifications → complete → /(tabs).
# Captura un screenshot por paso para validación visual contra los mockups HTML.
appId: com.joalvm.rea
name: Completar onboarding
tags:
    - onboarding
    - journey
    - visual
---
- runFlow: ./00-abrir-app-limpia.yaml
- waitForAnimationToEnd:
      timeout: 5000

# 1) Welcome
- takeScreenshot: onboarding-01-welcome
- assertVisible:
      id: onboarding-cta-primary
      enabled: true
- tapOn:
      id: onboarding-cta-primary

# 2) Profile — nombre obligatorio
- assertVisible:
      id: "onboarding-profile-name"
- assertVisible:
      id: "onboarding-cta-primary"
      enabled: false
- takeScreenshot: onboarding-02-profile-before-input
- tapOn:
      id: "onboarding-profile-name"
- inputText: "Rea"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: onboarding-02-profile-after-input
- assertVisible:
      id: "onboarding-cta-primary"
      enabled: true
- tapOn:
      id: "onboarding-cta-primary"

# 3) Intent — default tracking_only deja el CTA habilitado
- assertVisible:
      id: onboarding-intent-master-cycle
- takeScreenshot: onboarding-03-intent
- tapOn:
      id: onboarding-cta-primary

# 4) Cycle — valores default válidos
- assertVisible:
      id: onboarding-cycle-period
- takeScreenshot: onboarding-04-cycle
- tapOn:
      id: onboarding-cta-primary

# 5) Regularity — requiere seleccionar una opción
- assertVisible:
      id: onboarding-regularity-regular
- takeScreenshot: onboarding-05-regularity
- tapOn:
      id: onboarding-regularity-regular
- tapOn:
      id: onboarding-cta-primary

# 6) Last period — fecha default ya cargada
- assertVisible:
      id: onboarding-last-period-start
- takeScreenshot: onboarding-06-last-period
- tapOn:
      id: onboarding-cta-primary

# 7) Contraception — sin método (default, solo visible si modo = cycle)
- assertVisible:
      id: onboarding-contraception-prefer-not-to-say
- assertVisible:
      id: onboarding-cta-primary
- takeScreenshot: onboarding-07-contraception
- tapOn:
      id: onboarding-cta-primary

# 8) Notifications
- assertVisible:
      id: onboarding-notifications-enable
- takeScreenshot: onboarding-08-notifications
- tapOn:
      id: onboarding-cta-secondary

# 9) Complete → aterriza en /(tabs)
- extendedWaitUntil:
      visible:
          id: onboarding-cta-primary
      timeout: 30000
- takeScreenshot: onboarding-09-complete
- tapOn:
      id: onboarding-cta-primary

# Verifica llegada a las tabs.
- extendedWaitUntil:
      visible:
          id: tab-home
      timeout: 30000
- takeScreenshot: onboarding-final-tabs
